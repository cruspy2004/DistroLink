<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistroLink | Shorten</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(25, 25, 25, 0.6);
            --glass-border: rgba(192, 192, 192, 0.15);
            --accent: #c0c0c0;
            --accent-hover: #ffffff;
            --text-main: #f0f0f0;
            --text-muted: #888888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #151515, var(--bg-color));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            gap: 40px;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            animation: fadeInDown 0.8s ease;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
        }

        nav a:hover, nav a.active {
            color: var(--accent-hover);
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        header {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        p.subtitle { color: var(--text-muted); font-size: 1.2rem; font-weight: 300; }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.8s ease backwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 40px 70px -15px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .input-group { display: flex; flex-direction: column; gap: 20px; }
        
        input[type="url"] {
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        input[type="url"]:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 15px rgba(192, 192, 192, 0.2); 
            background: rgba(0, 0, 0, 0.6);
        }

        button {
            padding: 18px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #e0e0e0, #888888);
            color: #000;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        button:hover { 
            transform: scale(1.02); 
            box-shadow: 0 10px 20px rgba(192, 192, 192, 0.2); 
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(192, 192, 192, 0.05);
            border: 1px solid rgba(192, 192, 192, 0.2);
            display: none;
            text-align: center;
            animation: fade-in 0.5s ease;
        }
        
        .result-box p { margin-bottom: 10px; color: var(--text-muted); }
        .result-box a { 
            color: var(--accent-hover); 
            font-weight: 800; 
            font-size: 1.4rem; 
            text-decoration: none; 
            display: inline-block;
            transition: all 0.3s ease;
            word-break: break-all;
        }
        .result-box a:hover { 
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); 
            transform: scale(1.05);
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fade-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="active">Shorten</a>
        <a href="/history.html">System History</a>
    </nav>

    <header>
        <h1>DistroLink</h1>
        <p class="subtitle">Premium Distributed URL Shortener</p>
    </header>

    <div class="container">
        <div class="card">
            <form id="shortenForm">
                <div class="input-group">
                    <input type="url" id="urlInput" placeholder="Enter long URL (e.g., https://example.com/very/long/path)" required autocomplete="off">
                    <button type="submit" id="submitBtn">Generate Short Link</button>
                </div>
            </form>
            <div id="result" class="result-box"></div>
        </div>
    </div>

    <script>
        document.getElementById('shortenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('urlInput').value;
            const btn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            
            btn.disabled = true;
            btn.innerText = 'Processing...';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = '<p>Your shortened URL is ready:</p><a href="' + data.short_url + '" target="_blank">' + data.short_url + '</a>';
                    document.getElementById('urlInput').value = '';
                } else {
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = '<p style="color: #ef4444">Error: ' + data.error + '</p>';
                }
            } catch (err) {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '<p style="color: #ef4444">Network error occurred</p>';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Generate Short Link';
            }
        });
    </script>
</body>
</html>
