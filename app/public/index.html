<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistroLink | Distributed URL Shortener</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --node-color: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-color));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p.subtitle { color: var(--text-muted); font-size: 1.1rem; }

        .container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1000px;
            flex-wrap: wrap;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            flex: 1;
            min-width: 300px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s ease backwards;
        }

        .card:nth-child(2) { animation-delay: 0.2s; }

        h2 { font-size: 1.5rem; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }

        /* Form */
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        input[type="url"] {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="url"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }

        button {
            padding: 15px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover { background: var(--accent-hover); transform: translateY(-2px); }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: none;
            word-break: break-all;
        }
        .result-box a { color: var(--success); font-weight: 600; font-size: 1.2rem; text-decoration: none; }
        .result-box a:hover { text-decoration: underline; }

        /* Visualizer */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--accent); }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }

        .log-container {
            background: #000;
            border-radius: 8px;
            padding: 15px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #10b981;
            border: 1px solid var(--glass-border);
        }
        .log-line { margin-bottom: 5px; opacity: 0; animation: fade-in 0.3s forwards; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fade-in { to { opacity: 1; } }

        .flow-diagram {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .node { padding: 10px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; text-align: center; }
        .node-nginx { background: #eab308; color: black; }
        .node-app { background: var(--node-color); color: white; transition: all 0.2s; }
        .node-db { background: #3b82f6; color: white; }
        .arrow { color: var(--text-muted); }
        .active-node { transform: scale(1.1); box-shadow: 0 0 15px var(--node-color); }
    </style>
</head>
<body>

    <header>
        <h1>DistroLink</h1>
        <p class="subtitle">Distributed URL Shortening Engine</p>
    </header>

    <div class="container">
        <!-- Main Form -->
        <div class="card">
            <h2>Shorten URL</h2>
            <form id="shortenForm">
                <div class="input-group">
                    <input type="url" id="urlInput" placeholder="https://your-very-long-url.com/path" required autocomplete="off">
                    <button type="submit" id="submitBtn">Generate Short Link</button>
                </div>
            </form>
            <div id="result" class="result-box"></div>
        </div>

        <!-- System Visualizer -->
        <div class="card">
            <h2>System State</h2>
            
            <div class="flow-diagram">
                <div class="node node-nginx">Nginx LB</div>
                <div class="arrow">➔</div>
                <div class="node node-app" id="appNodeVisual">Node.js App</div>
                <div class="arrow">➔</div>
                <div class="node node-db">Postgres/Redis</div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="statUrls">0</div>
                    <div class="stat-label">Total URLs</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statHitRate">0%</div>
                    <div class="stat-label">Cache Hit Rate</div>
                </div>
            </div>

            <div class="log-container" id="terminal">
                <div class="log-line">> System initialized. Waiting for requests...</div>
            </div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const appNodeVisual = document.getElementById('appNodeVisual');
        
        function addLog(message) {
            const time = new Date().toLocaleTimeString();
            const el = document.createElement('div');
            el.className = 'log-line';
            el.innerHTML = `<span style="color:#6b7280">[${time}]</span> ${message}`;
            terminal.appendChild(el);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function fetchStats() {
            try {
                const res = await fetch('/monitor');
                const data = await res.json();
                document.getElementById('statUrls').innerText = data.total_urls;
                document.getElementById('statHitRate').innerText = data.cache_hit_rate;
            } catch (err) {}
        }
        
        // Initial fetch and poll
        fetchStats();
        setInterval(fetchStats, 3000);

        document.getElementById('shortenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('urlInput').value;
            const btn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            
            btn.disabled = true;
            btn.innerText = 'Processing...';
            resultDiv.style.display = 'none';

            addLog(`Requesting load balancer to shorten URL...`);

            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    addLog(`Routed to Node <b style="color:#a78bfa">${data.node_id}</b>`);
                    
                    // Flash node
                    appNodeVisual.classList.add('active-node');
                    appNodeVisual.innerText = 'Node ' + data.node_id;
                    setTimeout(() => {
                        appNodeVisual.classList.remove('active-node');
                        appNodeVisual.innerText = 'Node.js App';
                    }, 800);

                    addLog(`Acquired distributed lock via Redis`);
                    addLog(`Stored mapping in PostgreSQL & cached in Redis`);
                    addLog(`Successfully generated: <span style="color:#fff">${data.code}</span>`);
                    
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = 'Success! <br><br> <a href="' + data.short_url + '" target="_blank">' + data.short_url + '</a>';
                    document.getElementById('urlInput').value = '';
                    fetchStats();
                } else {
                    addLog(`<span style="color:#ef4444">Error: ${data.error}</span>`);
                }
            } catch (err) {
                addLog(`<span style="color:#ef4444">Network error</span>`);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Generate Short Link';
            }
        });
    </script>
</body>
</html>
