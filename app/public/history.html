<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistroLink | System History</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(25, 25, 25, 0.6);
            --glass-border: rgba(192, 192, 192, 0.15);
            --accent: #c0c0c0;
            --accent-hover: #ffffff;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --node-color: #a0a0a0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #151515, var(--bg-color));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            gap: 40px;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            animation: fadeInDown 0.8s ease;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
        }

        nav a:hover, nav a.active {
            color: var(--accent-hover);
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        header {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle { color: var(--text-muted); font-size: 1.2rem; font-weight: 300; }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 0 20px;
            margin-bottom: 50px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.8s ease backwards;
            margin-bottom: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 40px 70px -15px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        h2 { 
            font-size: 1.8rem; 
            margin-bottom: 30px; 
            color: var(--accent-hover);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* Visualizer */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            transition: transform 0.3s ease, background 0.3s ease;
        }
        .stat-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
        }
        .stat-value { font-size: 3rem; font-weight: 800; color: var(--accent-hover); text-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
        .stat-label { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; }

        .flow-diagram {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(0,0,0,0.4);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }
        .node { 
            padding: 15px 25px; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 1rem; 
            text-align: center; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .node-nginx { background: linear-gradient(135deg, #444, #222); color: #fff; }
        .node-app { background: linear-gradient(135deg, #666, #444); color: #fff; transition: all 0.3s; }
        .node-db { background: linear-gradient(135deg, #333, #111); color: #fff; }
        .arrow { color: var(--accent); font-size: 1.5rem; animation: pulse 2s infinite; }
        .active-node { transform: scale(1.1); box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); border-color: var(--accent-hover); }

        .log-container {
            background: #000;
            border-radius: 16px;
            padding: 20px;
            height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #d1d5db;
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 5px 20px rgba(0,0,0,0.8);
        }
        .log-line { margin-bottom: 8px; opacity: 0; animation: fade-in 0.4s forwards; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fade-in { to { opacity: 1; } }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        
        /* Custom Scrollbar for logs */
        .log-container::-webkit-scrollbar { width: 8px; }
        .log-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); border-radius: 8px; }
        .log-container::-webkit-scrollbar-thumb { background: rgba(192,192,192,0.3); border-radius: 8px; }
        .log-container::-webkit-scrollbar-thumb:hover { background: rgba(192,192,192,0.5); }
    </style>
</head>
<body>

    <nav>
        <a href="/">Shorten</a>
        <a href="/history.html" class="active">System History</a>
    </nav>

    <header>
        <h1>System Monitor</h1>
        <p class="subtitle">Live Architecture Overview</p>
    </header>

    <div class="container">
        <div class="card">
            
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="statUrls">0</div>
                    <div class="stat-label">Total URLs Created</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statHitRate">0%</div>
                    <div class="stat-label">Cache Hit Rate</div>
                </div>
            </div>

            <h2>Architecture Flow</h2>
            <div class="flow-diagram">
                <div class="node node-nginx">Nginx LB</div>
                <div class="arrow">➔</div>
                <div class="node node-app" id="appNodeVisual">Node.js App</div>
                <div class="arrow">➔</div>
                <div class="node node-db">Postgres/Redis</div>
            </div>

            <h2>Live Activity Logs</h2>
            <div class="log-container" id="terminal">
                <div class="log-line">> Monitoring system initialized...</div>
                <div class="log-line">> Establishing connection to nodes...</div>
                <div class="log-line">> Awaiting traffic...</div>
            </div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const appNodeVisual = document.getElementById('appNodeVisual');
        
        function addLog(message, isImportant = false) {
            const time = new Date().toLocaleTimeString();
            const el = document.createElement('div');
            el.className = 'log-line';
            const color = isImportant ? '#ffffff' : '#9ca3af';
            el.innerHTML = `<span style="color:#6b7280">[${time}]</span> <span style="color:${color}">${message}</span>`;
            terminal.appendChild(el);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function fetchStats() {
            try {
                const res = await fetch('/monitor');
                const data = await res.json();
                
                const prevUrls = document.getElementById('statUrls').innerText;
                if (prevUrls !== "0" && prevUrls !== String(data.total_urls)) {
                    addLog('New URL created successfully!', true);
                    
                    // Flash node to simulate activity
                    appNodeVisual.classList.add('active-node');
                    setTimeout(() => {
                        appNodeVisual.classList.remove('active-node');
                    }, 1000);
                }

                document.getElementById('statUrls').innerText = data.total_urls;
                document.getElementById('statHitRate').innerText = data.cache_hit_rate;
            } catch (err) {
                console.error(err);
            }
        }
        
        // Initial fetch and poll
        fetchStats();
        setInterval(fetchStats, 2000);
        
        // Simulate background heartbeat
        setInterval(() => {
            if(Math.random() > 0.8) {
                addLog('Heartbeat sync: Redis cache verified.');
            }
        }, 8000);
    </script>
</body>
</html>
