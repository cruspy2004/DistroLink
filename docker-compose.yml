services:
  nginx:
    image: nginx:alpine
    ports: 
      - "80:80"
    depends_on: 
      - app
    volumes: 
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  app:
    build: ./app
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/distrolink
      - REDIS_URL=redis://redis:6379
      - NODE_ID={{.Task.Slot}}
    depends_on: 
      - postgres
      - redis

  postgres:
    image: postgres:15
    volumes: 
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=distrolink
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes

volumes:
  pgdata:
