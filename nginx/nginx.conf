events {
    worker_connections 1024;
}

http {
    upstream distrolink_nodes {
        # Using max_fails and fail_timeout as open-source equivalent to passive health check
        server app:3000 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://distrolink_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            proxy_pass http://distrolink_nodes;
        }
    }
}
